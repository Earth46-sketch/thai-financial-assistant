<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thai Financial Assistant</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container">

    <h1 class="title">
      Thai Financial Assistant
    </h1>

    <div class="card">

      <h2>Monthly Summary</h2>

      <div class="summary-row">
        <span>Monthly Income</span>
        <span id="incomeDisplay">31,000 ฿</span>
      </div>

      <div class="summary-row">
        <span>Monthly Expense</span>
        <span id="expenseDisplay">16,500 ฿</span>
      </div>

      <div class="summary-row">
        <span>Estimated Tax</span>
        <span id="taxDisplay">2,500 ฿</span>
      </div>

      <div class="summary-row total">
        <span>Net Cashflow</span>
        <span id="cashflowDisplay">12,000 ฿</span>
      </div>

    </div>

    <div class="card">

      <h2>Quick Input</h2>

      <input 
        type="number"
        id="incomeInput"
        placeholder="Monthly Income"
      >

      <input 
        type="number"
        id="expenseInput"
        placeholder="Monthly Expense"
      >

      <button onclick="calculateFinance()">
        Calculate
      </button>

    </div>

  </div>

  <script src="js/app.js"></script>

</body>
</html>
