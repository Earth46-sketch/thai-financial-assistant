<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Financial Assistant</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container">

    <h1 class="title">
      Thai Financial Assistant
    </h1>

    <div class="card">

      <h2>Financial Summary</h2>

      <div class="summary-row">
        <span>Annual Income</span>
        <span id="incomeDisplay">0 ฿</span>
      </div>

      <div class="summary-row">
        <span>Total Deduction</span>
        <span id="deductionDisplay">0 ฿</span>
      </div>

      <div class="summary-row">
        <span>Taxable Income</span>
        <span id="taxableDisplay">0 ฿</span>
      </div>

      <div class="summary-row">
        <span>Annual Tax</span>
        <span id="taxDisplay">0 ฿</span>
      </div>

      <div class="summary-row total">
        <span>Monthly Cashflow</span>
        <span id="cashflowDisplay">0 ฿</span>
      </div>

    </div>

    <div class="card">

      <h2>Thai Tax Planner</h2>

      <input
        type="number"
        id="salaryInput"
        placeholder="Monthly Salary (฿)"
      >

      <input
        type="number"
        id="bonusInput"
        placeholder="Bonus (Months)"
      >

      <input
        type="number"
        id="monthsInput"
        placeholder="Months Worked"
      >

      <input
        type="number"
        id="expenseInput"
        placeholder="Monthly Expense (฿)"
      >

      <hr>

      <input
        type="number"
        id="lifeInsuranceInput"
        placeholder="Life Insurance Deduction (฿)"
      >

      <input
        type="number"
        id="ssfInput"
        placeholder="SSF Investment (฿)"
      >

      <input
        type="number"
        id="rmfInput"
        placeholder="RMF Investment (฿)"
      >

      <input
        type="number"
        id="providentInput"
        placeholder="Provident Fund (฿)"
      >

     <input
  type="number"
  id="providentInput"
  placeholder="Provident Fund (฿)"
>

<button onclick="calculateFinance()">
  Calculate Tax
</button>

</div>

<div class="card">

  <h2>Tax Saving Recommendation</h2>

  <div class="summary-row">
    <span>Potential Tax Saving</span>
    <span id="savingDisplay">0 ฿</span>
  </div>

</div>

<script src="js/app.js"></script>

</body>

</html>

  <div class="card">



  <script src="js/app.js"></script>

</body>

</html>
